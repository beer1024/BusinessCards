<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Card Design Studio</title>
<style>
:root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --border: #334155;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
.chat-container { width: 42%; min-width: 340px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.chat-header { padding: 18px 20px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.chat-header span { font-size: 0.75rem; color: var(--accent); background: rgba(56,189,248,.12); padding: 4px 10px; border-radius: 999px; }
.header-controls { display: flex; align-items: center; gap: 8px; }
.edit-front-btn { display: none; background: none; border: 1px solid var(--border); color: var(--muted); font-size: 0.72rem; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.edit-front-btn.visible { display: inline-block; }
.edit-front-btn:hover { border-color: var(--accent); color: var(--accent); }
.progress-row { padding: 10px 20px; border-bottom: 1px solid var(--border); font-size: 0.78rem; color: var(--muted); display: none; }
.progress-row.visible { display: block; }
.progress-bar-track { margin-top: 6px; height: 5px; background: #0f172a; border-radius: 999px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s ease; }
.chat-messages { flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.message { max-width: 88%; padding: 12px 16px; border-radius: 12px; line-height: 1.45; font-size: 0.92rem; white-space: pre-line; }
.message.agent { background: #334155; align-self: flex-start; border-left: 3px solid var(--accent); }
.message.user { background: var(--accent); color: #0f172a; align-self: flex-end; font-weight: 500; }
.chat-input-area { padding: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.upload-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.82rem; color: var(--muted); background: #0f172a; padding: 10px 12px; border-radius: 8px; border: 1px dashed var(--border); }
.upload-row label { cursor: pointer; }
.upload-row label:hover strong { color: var(--accent); }
.upload-row input[type=file] {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.input-row { display: flex; gap: 8px; }
.input-row input[type=text] { flex: 1; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 0.92rem; }
.input-row input[type=text]:focus { outline: none; border-color: var(--accent); }
.input-row button, .download-btn { padding: 0 18px; background: var(--accent); color: #0f172a; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
.input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
.preview-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 20px; position: relative; }
.preview-header { position: absolute; top: 24px; display: flex; gap: 8px; }
.side-toggle-btn { background: #334155; color: var(--text); border: 1px solid var(--border); padding: 7px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.82rem; }
.side-toggle-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
.card-label { position: absolute; top: 72px; font-size: 0.75rem; color: var(--muted); letter-spacing: 1.4px; text-transform: uppercase; font-weight: 700; }
.business-card { width: 480px; height: 274px; border-radius: 12px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / .65); position: relative; overflow: hidden; background: #fff; }
.business-card.portrait { width: 274px; height: 480px; }
.orientation-picker { display: flex; gap: 14px; align-self: flex-start; margin-top: -4px; }
.orientation-btn { background: #0f172a; border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 0.78rem; font-weight: 600; }
.orientation-btn:hover { border-color: var(--accent); color: var(--accent); }
.orientation-rect { display: block; background: #334155; border: 2px solid var(--muted); border-radius: 3px; }
.orientation-btn:hover .orientation-rect { border-color: var(--accent); }
.orientation-rect.landscape { width: 46px; height: 30px; }
.orientation-rect.portrait { width: 30px; height: 46px; }
.template-picker { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-self: flex-start; margin-top: -4px; max-width: 92%; }
.template-btn { background: #0f172a; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 0.74rem; font-weight: 600; text-align: left; display: flex; align-items: center; gap: 6px; }
.template-btn:hover { border-color: var(--accent); color: var(--accent); }
.template-icon { font-size: 1rem; }
.spec-readout { position: absolute; bottom: 24px; width: min(420px, 90%); background: rgba(30,41,59,.88); border: 1px solid var(--border); padding: 12px 16px; border-radius: 10px; font-size: 0.78rem; color: var(--muted); }
.spec-readout strong { color: var(--text); }
.download-btn { position: absolute; bottom: 24px; right: 24px; padding: 10px 18px; font-size: 0.85rem; }
@media (max-width: 900px) {
    body { flex-direction: column; height: auto; min-height: 100vh; }
    .chat-container { width: 100%; height: 45vh; }
    .business-card { width: 340px; height: 194px; }
    .business-card.portrait { width: 194px; height: 340px; }
}
</style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        Creative Direction Studio
        <div class="header-controls">
            <button class="edit-front-btn" id="editFrontBtn" onclick="goBackToFront()">← Edit Front</button>
            <span>Agent Active</span>
        </div>
    </div>
    <div class="progress-row" id="progressRow">
        <span id="progressText">0 of 12 details</span>
        <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message agent">Hello! Would you like a one-sided or two-sided business card?</div>
    </div>
    <div class="chat-input-area">
        <div class="upload-row">
            <label for="imageUpload"><strong>Upload Image:</strong></label>
            <input type="file" id="imageUpload" accept="image/*">
        </div>
        <div class="input-row">
            <input type="text" id="userInput" placeholder="Tell me what to change…" autofocus>
            <button id="sendBtn">Send</button>
        </div>
    </div>
</div>

<div class="preview-container">
    <div class="preview-header">
        <button class="side-toggle-btn active" id="btnFront" onclick="switchSide('front')">Front</button>
        <button class="side-toggle-btn" id="btnBack" onclick="switchSide('back')">Back</button>
    </div>
    <div class="card-label" id="cardSideLabel">Viewing: Front Side</div>
    <div class="business-card" id="cardPreview"></div>
    <div class="spec-readout">
        <div><strong>Vibe:</strong> <span id="vibeText">—</span></div>
        <div><strong>Layout:</strong> <span id="layoutText">Waiting for image…</span></div>
    </div>
    <button class="download-btn" onclick="downloadCard()">Download PNG</button>
</div>

<script>
// Keep this list in sync with BACK_FIELDS in server.py
const BACK_FIELD_KEYS = [
    'name', 'title', 'company', 'phone', 'email', 'website',
    'address', 'social', 'qr_code', 'tagline', 'services', 'cta'
];

// Keep this in sync with the "question" text in BACK_FIELDS in server.py
const BACK_FIELD_QUESTIONS = {
    name: "Do you want your full name on the back?",
    title: "Do you want a job title on the back?",
    company: "Do you want a company name on the back?",
    phone: "Do you want a phone number on the back?",
    email: "Do you want an email address on the back?",
    website: "Do you want a website URL on the back?",
    address: "Do you want a physical address on the back?",
    social: "Do you want social media handles on the back?",
    qr_code: "Do you want a QR code on the back?",
    tagline: "Do you want a tagline or slogan on the back?",
    services: "Do you want a short list of services on the back?",
    cta: "Do you want a call-to-action, like 'Call now' or 'Visit us online'?"
};

function nextBackQuestion() {
    const c = state.design_spec.contact || {};
    for (const key of BACK_FIELD_KEYS) {
        if (c[key] === null || c[key] === undefined) {
            return BACK_FIELD_QUESTIONS[key];
        }
    }
    return "Looks like the back is already complete! Want to review it, or is it ready to download?";
}

// Keep this list in sync with BACK_TEMPLATES in app.py — id/label/
// comfortable_field_count must match exactly.
const BACK_TEMPLATES = [
    { id: 'classic_centered', label: 'Classic Centered', icon: '⊙', comfortable_field_count: 6 },
    { id: 'left_block', label: 'Left-Aligned Block', icon: '▤', comfortable_field_count: 8 },
    { id: 'icon_list', label: 'Icon List', icon: '☰', comfortable_field_count: 9 },
    { id: 'split_two_column', label: 'Split Two-Column', icon: '▥', comfortable_field_count: 7 },
    { id: 'top_banner', label: 'Top Banner', icon: '▬', comfortable_field_count: 8 },
    { id: 'bordered_frame', label: 'Bordered Frame', icon: '▢', comfortable_field_count: 6 },
    { id: 'bottom_corner', label: 'Bottom-Corner Minimal', icon: '◺', comfortable_field_count: 3 },
    { id: 'qr_forward', label: 'QR-Forward', icon: '▦', comfortable_field_count: 3 },
];

const BACK_TEMPLATE_QUESTION =
    "How would you like the back laid out? Pick a style: " +
    BACK_TEMPLATES.map((t, i) => `${i + 1}) ${t.label}`).join('; ') +
    ". (You can click one of the previews, or just tell me the name or number.)";

const CONFIRM_PHRASES = [
    'looks good', 'look good', 'its good', "it's good", 'thats good', "that's good",
    'lock it in', 'lock it', 'move to back', 'move on to the back', 'front is good',
    'looks fine', 'looks great', 'sounds good', 'good to go', "let's do the back",
    'ready for the back'
];

// Short standalone affirmations ("good", "ok", "yep") only count if the
// whole message is short and there's no negation — otherwise "not good"
// or "good, but move the image left" would wrongly trigger a lock.
const CONFIRM_WORDS = new Set([
    'good', 'great', 'perfect', 'nice', 'done', 'finished', 'yes', 'yep',
    'yup', 'ok', 'okay', 'correct', 'confirm', 'confirmed', 'ready'
]);

const NEGATION_MARKERS = ['not', "don't", 'dont', 'but', 'except', 'however', "isn't", 'isnt'];

const BACK_TO_FRONT_PHRASES = [
    'go back to the front', 'back to the front', 'edit the front',
    'change the front', 'redo the front', 'go back to front',
    'front again', 'unlock the front', 'go to the front', 'revisit the front'
];

function isFrontConfirmation(text) {
    const lower = text.toLowerCase().trim().replace(/[.!]+$/, '');
    if (CONFIRM_PHRASES.some(p => lower.includes(p))) return true;

    const hasNegation = NEGATION_MARKERS.some(n => lower.includes(n));
    if (hasNegation) return false;

    const words = lower.split(/\s+/).filter(Boolean);
    return words.some(w => CONFIRM_WORDS.has(w));
}

function isBackToFrontRequest(text) {
    const lower = text.toLowerCase().trim();
    return BACK_TO_FRONT_PHRASES.some(p => lower.includes(p));
}

const state = {
    activeSide: 'front',
    front_locked: false,
    // A single, unified undo history covering BOTH gate decisions (sides,
    // orientation, image yes/no) AND freeform front-design tweaks (full
    // bleed, resize, reposition, style). Any undo-ish phrase ("go back",
    // "undo", "never mind", "scratch that"...) pops the single most recent
    // entry regardless of which kind it is, handled instantly and locally
    // with no server/LLM round-trip. Each entry is either:
    //   { kind: 'gate', category, label, fieldKey, cascadeFields,
    //     reaskQuestion, isOrientation }
    //   { kind: 'tweak', category, label, spec }
    // where 'spec' (tweak) is a snapshot of the front-relevant fields as
    // they were *before* that change took effect.
    undoHistory: [],
    design_spec: {
        card_sides: null,
        front_orientation: null,
        back_orientation: null,
        image_declined: null,
        back_template: null,
        capacity_check_pending: false,
        capacity_suggestions: [],
        front_layout: 'Waiting for image',
        back_layout: 'Not started',
        style_vibe: 'Clean professional',
        image_fit: 'contain',
        image_scale: 1.0,
        image_position_x: 'center',
        image_position_y: 'middle',
        background_mode: 'extend',
        background_color: '#ffffff',
        has_lace_accents: false,
        back_complete: false,
        pending_field: null,
        pending_stage: null,
        pending_value: null,
        // null = not asked yet, "" / false = explicitly skipped, otherwise filled
        contact: {
            name: null, title: null, company: null, phone: null, email: null,
            website: null, address: null, social: null, qr_code: null,
            tagline: null, services: null, cta: null,
            back_image: null, back_image_kind: null
        }
    },
    originalImageUrl: null,
    image_uploaded: false
};

// ---------------------------------------------------------------------------
// UNIFIED UNDO — a single history of everything that's been decided so far
// this session: the four gate decisions (sides, front orientation, back
// orientation, image yes/no) AND freeform front-design tweaks (full bleed,
// resize, reposition, style). Any undo-ish phrase ("go back", "undo",
// "never mind", "scratch that"...) pops the single most recent entry,
// whichever kind it is, and restores it instantly and deterministically —
// no server/LLM round-trip needed. A *named* undo ("undo the full bleed",
// "go back to landscape") searches this same history for the most recent
// matching entry instead of always taking the very last one.
// ---------------------------------------------------------------------------

const FRONT_RELEVANT_FIELDS = [
    'front_layout', 'style_vibe', 'image_fit', 'image_scale',
    'image_position_x', 'image_position_y', 'background_mode',
    'background_color', 'has_lace_accents'
];

function snapshotFrontFields(spec) {
    const snap = {};
    FRONT_RELEVANT_FIELDS.forEach(k => { snap[k] = spec[k]; });
    return snap;
}

// Gate questions, mirrored here so a popped gate-decision entry can be
// re-asked locally without a server round-trip. Keep this wording in sync
// with app.py (SIDES_GATE_QUESTION / ORIENTATION_GATE_QUESTION_FRONT /
// ORIENTATION_GATE_QUESTION_BACK / IMAGE_GATE_QUESTION).
const SIDES_GATE_QUESTION = "Would you like a one-sided or two-sided business card?";
const ORIENTATION_FRONT_QUESTION = "Would you like the front in landscape (wide) or portrait (tall) orientation?";
const IMAGE_GATE_QUESTION = "Do you have an image you'd like to use, or would you like a text-only design instead?";

// Every category (gate decisions + design tweaks) pairs a human label (for
// confirmations) with keywords used to match a *named* undo request to the
// right past change. Checked in order, most specific first. front_layout is
// not its own category — it's a short LLM-written description regenerated
// on nearly every turn, so treating it as a change trigger would create
// noisy phantom undo entries; it's still included in each tweak snapshot so
// a real undo restores it too.
const UNDO_CATEGORIES = [
    { id: 'sides', label: 'chose one-sided or two-sided',
      keywords: ['one-sided', 'one sided', 'two-sided', 'two sided', 'single-sided',
        'single sided', 'double-sided', 'double sided', 'one side', 'two side',
        'both sides', 'sides'] },
    { id: 'orientation', label: 'chose that orientation',
      keywords: ['landscape', 'portrait', 'orientation', 'sideways'] },
    { id: 'image', label: 'answered the image question',
      keywords: ['have an image', 'have a logo', 'skip the image', 'skip the logo',
        'no image', 'no logo', 'text-only', 'text only', 'add the image',
        'image back', "don't want the image", 'without the image', 'the image', 'the logo'] },
    { id: 'bleed', label: 'made it full-bleed (edge-to-edge)',
      keywords: ['full bleed', 'full-bleed', 'edge to edge', 'edge-to-edge', 'bleed', 'cover'] },
    { id: 'contain', label: 'put the white border back (no longer full-bleed)',
      keywords: ['border', 'contain', 'no bleed', 'not full bleed'] },
    { id: 'position', label: 'repositioned the image',
      keywords: ['position', 'reposition', 'move', 'moved', 'left', 'right', 'top', 'bottom', 'centered'] },
    { id: 'scale', label: 'resized the image',
      keywords: ['resize', 'resized', 'bigger', 'smaller', 'scale', 'size'] },
    { id: 'background', label: 'changed the background',
      keywords: ['background', 'color', 'colour'] },
    { id: 'style', label: 'updated the style',
      keywords: ['style', 'vibe', 'look'] },
];

function categoryLabel(id) {
    const cat = UNDO_CATEGORIES.find(c => c.id === id);
    return cat ? cat.label : 'made that change';
}

// Figures out, from a before/after diff, which single design-tweak category
// best describes what just changed (checked in priority order — the most
// semantically significant field wins if several changed at once).
function deriveFrontChangeCategory(oldFields, newFields) {
    if (oldFields.image_fit !== newFields.image_fit) {
        return newFields.image_fit === 'cover' ? 'bleed' : 'contain';
    }
    if (oldFields.image_position_x !== newFields.image_position_x ||
        oldFields.image_position_y !== newFields.image_position_y) {
        return 'position';
    }
    if (oldFields.image_scale !== newFields.image_scale) {
        return 'scale';
    }
    if (oldFields.background_mode !== newFields.background_mode ||
        oldFields.background_color !== newFields.background_color) {
        return 'background';
    }
    if (oldFields.style_vibe !== newFields.style_vibe) {
        return 'style';
    }
    return null; // nothing front-relevant actually changed this turn
}

// True during the freeform front-design chat stage: sides, orientation and
// the image yes/no question are all resolved, and the front isn't locked
// yet. This is exactly the stage route_conversation would send to
// handle_front_side, and the only stage design-tweak history applies to.
function isFrontDesignStage() {
    const ds = state.design_spec;
    return ds.card_sides === 'two' && ds.front_orientation !== null &&
        ds.image_declined !== null && !state.front_locked;
}

// True once we're past all four gate decisions and into the back-side
// contact-field checklist (name/phone/etc). Undo for those per-field
// answers is explicitly out of scope (they already have their own
// edit/confirm flow) — once here, local unified undo steps aside and lets
// messages go to the server as before, rather than reaching back to undo a
// now-stale gate decision from several steps ago.
function isBackFieldStage() {
    const ds = state.design_spec;
    if (ds.card_sides === 'one') return ds.front_orientation !== null;
    if (ds.card_sides === 'two') return state.front_locked && ds.back_orientation !== null;
    return false;
}

// Broad net for "anything that suggests undoing what was just done" — not
// just the literal phrase "go back".
const BARE_UNDO_PHRASES = [
    'go back', 'go back one step', 'undo that', 'undo it', 'undo this', 'undo',
    'never mind', 'nevermind', 'revert that', 'revert it', 'revert', 'back up',
    'back it up', 'undo the last change', 'undo last', 'undo the last thing',
    'take that back', 'take it back', 'scratch that', 'cancel that', 'reverse that',
];

function isUndoRequest(text) {
    const lower = text.toLowerCase().trim().replace(/[.!]+$/, '');
    return BARE_UNDO_PHRASES.some(p => lower === p || lower.includes(p));
}

function matchUndoHistoryCategory(text) {
    const lower = text.toLowerCase();
    for (const cat of UNDO_CATEGORIES) {
        if (cat.keywords.some(k => lower.includes(k))) return cat.id;
    }
    return null;
}

// Restores a gate-decision entry: resets its field (and any cascade
// fields), re-asks that gate's own question, and shows the orientation
// picker again if applicable.
function restoreGateEntry(entry) {
    state.design_spec[entry.fieldKey] = null;
    (entry.cascadeFields || []).forEach(f => { state.design_spec[f] = null; });
    if (entry.fieldKey === 'card_sides') {
        state.front_locked = false;
        updateEditFrontButtonVisibility();
        switchSide('front');
    }
    appendMessage('agent', `Got it — back to before I ${entry.label}. ${entry.reaskQuestion}`);
    if (entry.isOrientation) appendOrientationPicker();
    render();
}

function restoreTweakEntry(entry) {
    Object.assign(state.design_spec, entry.spec);
    appendMessage('agent', `Got it — back to before I ${entry.label}.`);
    render();
}

function restoreUndoEntry(entry) {
    if (entry.kind === 'gate') restoreGateEntry(entry);
    else restoreTweakEntry(entry);
}

// Handles a local unified undo request without any network call. Returns
// true if it handled the message (caller should stop), false if this
// wasn't actually an undo request (or we're past the point where local
// undo applies) so the normal flow should continue.
function tryHandleUndo(text) {
    if (isBackFieldStage() || !isUndoRequest(text)) return false;

    const targetCategory = matchUndoHistoryCategory(text);

    if (targetCategory) {
        const idx = state.undoHistory.map(e => e.category).lastIndexOf(targetCategory);
        if (idx === -1) {
            appendMessage('agent', "I haven't made that kind of change yet, so there's nothing to undo there.");
            return true;
        }
        const entry = state.undoHistory[idx];
        state.undoHistory = state.undoHistory.slice(0, idx);
        restoreUndoEntry(entry);
        return true;
    }

    if (state.undoHistory.length === 0) {
        appendMessage('agent', "There's nothing to undo yet.");
        return true;
    }
    const entry = state.undoHistory.pop();
    restoreUndoEntry(entry);
    return true;
}

function esc(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
}

function switchSide(side) {
    state.activeSide = side;
    document.getElementById('btnFront').classList.toggle('active', side === 'front');
    document.getElementById('btnBack').classList.toggle('active', side === 'back');
    document.getElementById('cardSideLabel').textContent = `Viewing: ${side === 'front' ? 'Front' : 'Back'} Side`;
    render();
}

function updateEditFrontButtonVisibility() {
    document.getElementById('editFrontBtn').classList.toggle(
        'visible', state.front_locked && state.design_spec.card_sides !== 'one'
    );
}

function updateSidesUI() {
    const sides = state.design_spec.card_sides;
    const uploadRow = document.querySelector('.upload-row');
    const btnFront = document.getElementById('btnFront');
    const btnBack = document.getElementById('btnBack');
    const previewHeader = document.querySelector('.preview-header');

    if (sides === null || sides === undefined) {
        // Still deciding one-sided vs two-sided — no card exists yet.
        previewHeader.style.display = 'none';
        uploadRow.style.display = 'none';
        return;
    }

    previewHeader.style.display = '';

    if (sides === 'one') {
        // A one-sided card has no front/image design — it's just the back.
        uploadRow.style.display = 'none';
        btnFront.style.display = 'none';
        btnBack.style.display = 'none';
        if (state.activeSide !== 'back') {
            state.activeSide = 'back';
            document.getElementById('cardSideLabel').textContent = 'Viewing: Back Side';
        }
    } else {
        uploadRow.style.display = '';
        btnFront.style.display = '';
        btnBack.style.display = '';
    }
}

function goBackToFront() {
    state.front_locked = false;
    // Clear any in-progress back confirmation, but keep already-answered
    // contact fields — nothing already locked in gets lost.
    state.design_spec.pending_field = null;
    state.design_spec.pending_stage = null;
    state.design_spec.pending_value = null;
    switchSide('front');
    updateEditFrontButtonVisibility();
    appendMessage('agent', "Sure, let's go back to the front. What would you like to change?");
}

function updateProgress() {
    const row = document.getElementById('progressRow');
    if (!state.front_locked) {
        row.classList.remove('visible');
        return;
    }
    const c = state.design_spec.contact || {};
    const answered = BACK_FIELD_KEYS.filter(k => c[k] !== null && c[k] !== undefined).length;
    const total = BACK_FIELD_KEYS.length;
    row.classList.add('visible');
    document.getElementById('progressText').textContent = `${answered} of ${total} details`;
    document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
}

function sampleEdgeColor(img) {
    const c = document.createElement('canvas');
    c.width = img.width;
    c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const w = img.width;
    const h = img.height;
    const samples = [];
    const steps = 12;

    for (let i = 0; i <= steps; i++) {
        const x = Math.floor((w - 1) * (i / steps));
        samples.push(ctx.getImageData(x, 2, 1, 1).data);
        samples.push(ctx.getImageData(x, h - 3, 1, 1).data);
    }
    for (let i = 0; i <= steps; i++) {
        const y = Math.floor((h - 1) * (i / steps));
        samples.push(ctx.getImageData(2, y, 1, 1).data);
        samples.push(ctx.getImageData(w - 3, y, 1, 1).data);
    }

    let r = 0, g = 0, b = 0, count = 0;
    samples.forEach(d => {
        if (d[3] > 200) {
            r += d[0];
            g += d[1];
            b += d[2];
            count++;
        }
    });

    if (count === 0) return '#ffffff';
    return `rgb(${Math.round(r / count)}, ${Math.round(g / count)}, ${Math.round(b / count)})`;
}

function buildCardImage(cb) {
    if (!state.originalImageUrl) { cb(null); return; }

    const img = new Image();
    img.onload = () => {
        const isPortrait = state.design_spec.front_orientation === 'portrait';
        const W = isPortrait ? 548 : 960, H = isPortrait ? 960 : 548;
        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');

        const ds = state.design_spec;
        const mode = ds.background_mode || 'extend';

        if (mode === 'white') {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);
        } else if (mode === 'solid') {
            ctx.fillStyle = ds.background_color || '#ffffff';
            ctx.fillRect(0, 0, W, H);
        } else {
            ctx.fillStyle = sampleEdgeColor(img);
            ctx.fillRect(0, 0, W, H);
        }

        const fit = ds.image_fit || 'contain';

        if (fit === 'cover') {
            const scale = Math.max(W / img.width, H / img.height);
            const w = img.width * scale;
            const h = img.height * scale;
            const x = (W - w) / 2;
            const y = (H - h) / 2;
            ctx.drawImage(img, x, y, w, h);
        } else {
            const scale = (ds.image_scale || 1.0);
            const maxW = W * scale;
            const maxH = H * scale;
            const ratio = Math.min(maxW / img.width, maxH / img.height);
            const w = img.width * ratio;
            const h = img.height * ratio;

            let x = (W - w) / 2;
            let y = (H - h) / 2;
            if (ds.image_position_x === 'left')  x = W * 0.05;
            if (ds.image_position_x === 'right') x = W - w - W * 0.05;
            if (ds.image_position_y === 'top')   y = H * 0.06;
            if (ds.image_position_y === 'bottom') y = H - h - H * 0.06;

            ctx.drawImage(img, x, y, w, h);
        }

        cb(canvas.toDataURL('image/png'));
    };
    img.src = state.originalImageUrl;
}

function buildBackCardImage(cb) {
    const isPortrait = state.design_spec.back_orientation === 'portrait';
    const W = isPortrait ? 548 : 960, H = isPortrait ? 960 : 548;
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    const c = state.design_spec.contact || {};
    const left = 60;
    let y = 90;

    if (c.name) {
        ctx.fillStyle = '#0f172a';
        ctx.font = '700 34px sans-serif';
        ctx.fillText(c.name, left, y);
        y += 40;
    }
    if (c.title) {
        ctx.fillStyle = '#64748b';
        ctx.font = '400 20px sans-serif';
        ctx.fillText(c.title, left, y);
        y += 26;
    }
    if (c.company) {
        ctx.fillStyle = '#334155';
        ctx.font = '600 20px sans-serif';
        ctx.fillText(c.company, left, y);
        y += 34;
    }

    y += 10;
    ctx.fillStyle = '#334155';
    ctx.font = '400 18px sans-serif';
    [c.phone, c.email, c.website, c.address, c.social].filter(Boolean).forEach(line => {
        ctx.fillText(line, left, y);
        y += 26;
    });

    if (c.tagline) {
        y += 14;
        ctx.fillStyle = '#475569';
        ctx.font = 'italic 18px sans-serif';
        ctx.fillText('"' + c.tagline + '"', left, y);
        y += 26;
    }
    if (c.services) {
        ctx.fillStyle = '#64748b';
        ctx.font = '400 16px sans-serif';
        ctx.fillText(c.services, left, y);
        y += 24;
    }
    if (c.cta) {
        ctx.fillStyle = '#0f172a';
        ctx.font = '700 18px sans-serif';
        ctx.fillText(c.cta, left, y);
        y += 24;
    }
    if (c.qr_code) {
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.strokeRect(W - 180, H - 180, 120, 120);
        ctx.fillStyle = '#64748b';
        ctx.font = '400 14px sans-serif';
        ctx.fillText('QR CODE', W - 168, H - 115);
    }

    ctx.fillStyle = '#94a3b8';
    ctx.font = '400 14px sans-serif';
    ctx.fillText('3.5" x 2.0"', W - 130, H - 30);

    cb(canvas.toDataURL('image/png'));
}

// Counts how many of the 12 back fields are actually filled with truthy
// values (skips nulls/false/empty strings) — drives the compact-mode
// decision when the customer has more content than the template expects.
function filledBackFieldCount(c) {
    if (!c) return 0;
    return BACK_FIELD_KEYS.filter(k => c[k]).length;
}

// Renders whatever image the customer added (upload or generated QR) as
// an <img>, or null if nothing was added.
function backImageHTML(c, maxSize) {
    if (!c || !c.back_image) return '';
    const label = c.back_image_kind === 'qr' ? 'QR code' : 'image';
    return `<img src="${c.back_image}" alt="${label}" style="max-width:${maxSize}px;max-height:${maxSize}px;border-radius:4px;object-fit:contain;">`;
}

// Builds the plain contact-detail lines (phone/email/website/address/
// social) shared across every template layout.
function contactLines(c, opts) {
    opts = opts || {};
    const icons = opts.icons || {};
    const lines = [];
    const push = (key, val, extraStyle) => {
        if (!val) return;
        const icon = icons[key] ? `${icons[key]} ` : '';
        lines.push(`<div style="${extraStyle || ''}">${icon}${esc(val)}</div>`);
    };
    push('phone', c.phone);
    push('email', c.email);
    push('website', c.website, 'color:#0284c7;');
    push('address', c.address);
    push('social', c.social);
    return lines.join('');
}

// Renders the customer's chosen back-side layout template. `templateId`
// defaults to 'left_block' (today's original look) until a template has
// been picked, so nothing breaks before that gate resolves. `compact`
// scales font sizes down when the filled field count exceeds the
// template's comfortable_field_count (set by finish_back_fields on the
// server) — every field is always shown, just more tightly.
function renderTemplateBody(templateId, c, compact) {
    const nameSz = compact ? '0.92rem' : '1.05rem';
    const bodySz = compact ? '0.68rem' : '0.78rem';
    const gapTop = compact ? '5px' : '8px';

    const header = () => {
        let h = '';
        if (c.name) h += `<div style="font-weight:700;font-size:${nameSz};color:#0f172a;margin-bottom:2px;">${esc(c.name)}</div>`;
        if (c.title) h += `<div style="color:#64748b;font-size:${bodySz};margin-bottom:2px;">${esc(c.title)}</div>`;
        if (c.company) h += `<div style="color:#334155;font-size:${bodySz};font-weight:600;margin-bottom:6px;">${esc(c.company)}</div>`;
        return h;
    };
    const extras = () => {
        let e = '';
        if (c.tagline) e += `<div style="margin-top:${gapTop};font-size:${bodySz};font-style:italic;color:#475569;">“${esc(c.tagline)}”</div>`;
        if (c.services) e += `<div style="margin-top:6px;font-size:${bodySz};color:#64748b;">${esc(c.services)}</div>`;
        if (c.cta) e += `<div style="margin-top:${gapTop};font-size:${bodySz};font-weight:600;color:#0f172a;">${esc(c.cta)}</div>`;
        return e;
    };
    const anyContent = c.name || c.title || c.company || c.phone || c.email || c.website ||
        c.address || c.social || c.tagline || c.services || c.cta || c.back_image;
    if (!anyContent) return '';

    switch (templateId) {
        case 'classic_centered': {
            const lines = contactLines(c);
            return `<div style="text-align:center;">
                ${header()}
                ${lines ? `<div style="margin-top:${gapTop};font-size:${bodySz};line-height:1.6;color:#334155;">${lines}</div>` : ''}
                ${extras()}
                ${c.back_image ? `<div style="margin-top:10px;display:flex;justify-content:center;">${backImageHTML(c, 60)}</div>` : ''}
            </div>`;
        }
        case 'icon_list': {
            const lines = contactLines(c, { icons: { phone: '📞', email: '✉️', website: '🌐', address: '📍', social: '👤' } });
            return `<div>
                ${header()}
                ${lines ? `<div style="margin-top:${gapTop};font-size:${bodySz};line-height:1.7;color:#334155;">${lines}</div>` : ''}
                ${extras()}
                ${c.back_image ? `<div style="margin-top:10px;">${backImageHTML(c, 50)}</div>` : ''}
            </div>`;
        }
        case 'split_two_column': {
            const lines = contactLines(c);
            return `<div style="display:flex;gap:12px;height:100%;">
                <div style="flex:1;border-right:1px solid #e2e8f0;padding-right:12px;">
                    ${header()}
                    ${lines ? `<div style="margin-top:${gapTop};font-size:${bodySz};line-height:1.6;color:#334155;">${lines}</div>` : ''}
                    ${extras()}
                </div>
                <div style="width:70px;display:flex;align-items:center;justify-content:center;">
                    ${c.back_image ? backImageHTML(c, 65) : '<span style="font-size:0.68rem;color:#94a3b8;">[ QR ]</span>'}
                </div>
            </div>`;
        }
        case 'top_banner': {
            const lines = contactLines(c);
            return `<div style="height:100%;display:flex;flex-direction:column;">
                <div style="background:#0f172a;color:#fff;padding:8px 10px;margin:-2px -2px 8px -2px;border-radius:4px 4px 0 0;">
                    ${c.name ? `<div style="font-weight:700;font-size:${nameSz};">${esc(c.name)}</div>` : ''}
                    ${c.title ? `<div style="font-size:${bodySz};opacity:.85;">${esc(c.title)}</div>` : ''}
                </div>
                ${c.company ? `<div style="color:#334155;font-size:${bodySz};font-weight:600;margin-bottom:6px;">${esc(c.company)}</div>` : ''}
                ${lines ? `<div style="font-size:${bodySz};line-height:1.6;color:#334155;">${lines}</div>` : ''}
                ${extras()}
                ${c.back_image ? `<div style="margin-top:8px;">${backImageHTML(c, 50)}</div>` : ''}
            </div>`;
        }
        case 'bordered_frame': {
            const lines = contactLines(c);
            return `<div style="border:2px solid #cbd5e1;border-radius:8px;padding:10px;height:calc(100% - 20px);text-align:center;">
                ${header()}
                ${lines ? `<div style="margin-top:${gapTop};font-size:${bodySz};line-height:1.6;color:#334155;">${lines}</div>` : ''}
                ${extras()}
                ${c.back_image ? `<div style="margin-top:8px;display:flex;justify-content:center;">${backImageHTML(c, 50)}</div>` : ''}
            </div>`;
        }
        case 'bottom_corner': {
            const lines = contactLines(c);
            return `<div style="height:100%;display:flex;flex-direction:column;justify-content:flex-end;">
                ${c.back_image ? `<div style="margin-bottom:8px;">${backImageHTML(c, 50)}</div>` : ''}
                ${header()}
                ${lines ? `<div style="font-size:${bodySz};line-height:1.5;color:#334155;">${lines}</div>` : ''}
                ${extras()}
            </div>`;
        }
        case 'qr_forward': {
            const lines = contactLines(c);
            return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
                ${c.back_image ? backImageHTML(c, 90) : '<div style="width:70px;height:70px;border:2px dashed #cbd5e1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.68rem;color:#94a3b8;">QR</div>'}
                <div style="margin-top:8px;">
                    ${c.name ? `<div style="font-weight:700;font-size:${bodySz};color:#0f172a;">${esc(c.name)}</div>` : ''}
                    ${lines ? `<div style="font-size:${bodySz};color:#334155;">${lines}</div>` : ''}
                </div>
            </div>`;
        }
        case 'left_block':
        default: {
            const lines = contactLines(c);
            return `<div>
                ${header()}
                ${lines ? `<div style="margin-top:${gapTop};font-size:${bodySz};line-height:1.5;color:#334155;">${lines}</div>` : ''}
                ${extras()}
                ${c.back_image ? `<div style="margin-top:10px;">${backImageHTML(c, 50)}</div>` : ''}
            </div>`;
        }
    }
}

// Top-level BACK SIDE card renderer — wraps renderTemplateBody with the
// lace-accent overlay and the footer bar, matching the front side's frame.
function renderBackCardHTML(ds) {
    const c = ds.contact || {};
    const templateId = ds.back_template || 'left_block';
    const template = BACK_TEMPLATES.find(t => t.id === templateId);
    const compact = template ? filledBackFieldCount(c) > template.comfortable_field_count : false;

    const lace = ds.has_lace_accents ?
        `<div style="position:absolute;top:10px;right:12px;opacity:.55;">✨</div>
         <div style="position:absolute;bottom:10px;left:12px;opacity:.55;">✨</div>` : '';

    let content = renderTemplateBody(templateId, c, compact);
    if (!content) {
        content = `<p style="font-size:0.8rem;color:#64748b;">${esc(ds.back_layout || 'Back side ready for information')}</p>`;
    }

    return `
        <div style="display:flex;flex-direction:column;height:100%;justify-content:space-between;position:relative;">
            ${lace}
            <div style="flex:1;min-height:0;overflow:hidden;">${content}</div>
            <div style="font-size:0.72rem;color:#64748b;border-top:1px solid #eee;padding-top:8px;display:flex;justify-content:space-between;">
                <span>Studio Spec</span>
                <span style="font-weight:600;">3.5″ × 2.0″</span>
            </div>
        </div>`;
}

function render() {
    updateSidesUI();
    const card = document.getElementById('cardPreview');
    const ds = state.design_spec;

    const activeOrientation = state.activeSide === 'front' ? ds.front_orientation : ds.back_orientation;
    card.classList.toggle('portrait', activeOrientation === 'portrait');

    document.getElementById('vibeText').textContent = ds.style_vibe || '—';
    document.getElementById('layoutText').textContent =
        (state.activeSide === 'front' ? ds.front_layout : ds.back_layout) || '—';

    updateProgress();

    if (state.activeSide === 'front' && state.image_uploaded) {
        buildCardImage((url) => {
            if (!url) return;
            card.style.padding = '0';
            card.style.background = '#000';
            card.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
        });
        return;
    }

    card.style.padding = '24px';
    card.style.background = '#ffffff';

    if (state.activeSide === 'front') {
        card.innerHTML = `
            <div style="display:flex;flex-direction:column;height:100%;justify-content:space-between;">
                <div>
                    <h2 style="font-size:1.2rem;font-weight:700;">Front</h2>
                    <p style="font-size:0.8rem;color:#475569;margin-top:8px;">${esc(ds.front_layout)}</p>
                </div>
                <div style="font-size:0.72rem;color:#64748b;border-top:1px solid #eee;padding-top:8px;">3.5″ × 2.0″</div>
            </div>`;
        return;
    }

    // BACK SIDE
    card.innerHTML = renderBackCardHTML(ds);
}

function appendMessage(role, text) {
    const box = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

// Visual rectangle picker for the orientation gate — clicking a rectangle
// sends "landscape"/"portrait" through the exact same path as typing it.
function appendOrientationPicker() {
    const box = document.getElementById('chatMessages');
    const wrap = document.createElement('div');
    wrap.className = 'orientation-picker';
    wrap.innerHTML = `
        <button class="orientation-btn" type="button" data-value="landscape">
            <span class="orientation-rect landscape"></span>
            Landscape
        </button>
        <button class="orientation-btn" type="button" data-value="portrait">
            <span class="orientation-rect portrait"></span>
            Portrait
        </button>`;
    wrap.querySelectorAll('.orientation-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            wrap.remove();
            send(btn.dataset.value);
        });
    });
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
}

const ORIENTATION_BACK_QUESTION = "And for the back — landscape (wide) or portrait (tall)?";

// Visual grid picker for the back-template gate — clicking a swatch sends
// that template's id through the exact same path as typing its name.
function appendBackTemplatePicker() {
    const box = document.getElementById('chatMessages');
    const wrap = document.createElement('div');
    wrap.className = 'template-picker';
    wrap.innerHTML = BACK_TEMPLATES.map(t => `
        <button class="template-btn" type="button" data-value="${t.id}">
            <span class="template-icon">${t.icon}</span>${esc(t.label)}
        </button>`).join('');
    wrap.querySelectorAll('.template-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            wrap.remove();
            send(btn.dataset.value);
        });
    });
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
}

// Shown when the customer filled in more fields than the chosen template
// comfortably fits — offers switching to 1-2 roomier suggestions, or
// keeping the current template as-is.
function appendCapacitySuggestions(suggestionIds) {
    const box = document.getElementById('chatMessages');
    const wrap = document.createElement('div');
    wrap.className = 'template-picker';
    const options = (suggestionIds || []).map(id => BACK_TEMPLATES.find(t => t.id === id)).filter(Boolean);
    wrap.innerHTML = options.map(t => `
        <button class="template-btn" type="button" data-value="${t.id}">
            <span class="template-icon">${t.icon}</span>${esc(t.label)}
        </button>`).join('') + `
        <button class="template-btn" type="button" data-value="__keep__">
            <span class="template-icon">✓</span>Keep current layout
        </button>`;
    wrap.querySelectorAll('.template-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            wrap.remove();
            send(btn.dataset.value === '__keep__' ? 'keep the current layout' : btn.dataset.value);
        });
    });
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
}

// Shown when the QR/image sub-flow is waiting on an upload — a small
// upload trigger appended right into the chat, same accessible-hidden-
// input technique as the main Upload Image control.
function appendBackImageUploadPrompt() {
    const box = document.getElementById('chatMessages');
    const wrap = document.createElement('div');
    wrap.className = 'template-picker';
    const inputId = 'backImageUpload_' + Date.now();
    wrap.innerHTML = `
        <label class="template-btn" for="${inputId}">
            <span class="template-icon">📎</span>Upload Image
        </label>
        <input type="file" id="${inputId}" accept="image/*"
               style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">`;
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
    document.getElementById(inputId).addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            state.design_spec.contact.back_image = ev.target.result;
            state.design_spec.contact.back_image_kind = 'upload';
            wrap.remove();
            render();
            appendMessage('agent', 'Image received!');
            callAgent("I've uploaded the image.");
        };
        reader.readAsDataURL(file);
    });
}

async function callAgent(text) {
    // Front -> back transition is handled entirely client-side: no need to
    // send "looks good" to the model and risk it being misread as an
    // answer to a contact-info question. Only applies once we're actually
    // in the two-sided front-design chat (both the sides gate, the
    // orientation gate, and the image gate resolved) — otherwise a reply
    // like "ok, two-sided", "portrait", or a bare "yes" answering the
    // image question could be misread as a front-lock confirmation.
    if (state.design_spec.card_sides === 'two' && state.design_spec.front_orientation !== null && state.design_spec.image_declined !== null && !state.front_locked && isFrontConfirmation(text)) {
        state.front_locked = true;
        switchSide('back');
        updateEditFrontButtonVisibility();
        // The back can have its own orientation, different from the front —
        // ask that before diving into contact-info questions.
        if (state.design_spec.back_orientation === null) {
            appendMessage('agent', "Front is locked. Now we build the back.\n\n" + ORIENTATION_BACK_QUESTION);
            appendOrientationPicker();
        } else {
            appendMessage('agent', "Front is locked. Now we build the back.\n\n" + nextBackQuestion());
        }
        return;
    }

    // Let the customer step back out to the front at any point while
    // working on the back, without losing back-side progress. Not
    // applicable to one-sided cards, which never had a front to begin with.
    if (state.design_spec.card_sides === 'two' && state.front_locked && isBackToFrontRequest(text)) {
        goBackToFront();
        return;
    }

    // "go back"/"undo"/"never mind"/etc. anywhere before the back-side
    // contact-field checklist: handled entirely locally and instantly from
    // the unified undo history, rather than sending it to the model (which
    // has no memory of prior state and would just guess at a reply).
    if (tryHandleUndo(text)) {
        return;
    }

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = '…';

    // Capture "before" snapshots so we can record what changed (if
    // anything) once the response comes back — both the four gate
    // decisions (always) and the front-design fields (only when this turn
    // is actually routed to the freeform front-design chat).
    const preGateSnapshot = {
        card_sides: state.design_spec.card_sides,
        front_orientation: state.design_spec.front_orientation,
        back_orientation: state.design_spec.back_orientation,
        image_declined: state.design_spec.image_declined,
    };
    const wasFrontDesignStage = isFrontDesignStage();
    const preFrontSnapshot = wasFrontDesignStage ? snapshotFrontFields(state.design_spec) : null;

    try {
        const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: text,
                state: state.design_spec,
                image_uploaded: state.image_uploaded,
                front_locked: state.front_locked
            })
        });
        const data = await res.json();

        if (data.design_spec) {
            state.design_spec = {
                ...state.design_spec,
                ...data.design_spec,
                contact: { ...state.design_spec.contact, ...(data.design_spec.contact || {}) }
            };
        }

        // Record any gate decision that just resolved (or changed to a new
        // value) this turn, so a later "undo" has a real entry to pop back
        // to unanswered, re-asking that gate's own question.
        const ds = state.design_spec;
        if (preGateSnapshot.card_sides !== ds.card_sides && ds.card_sides !== null) {
            state.undoHistory.push({
                kind: 'gate', category: 'sides',
                label: `chose a ${ds.card_sides === 'one' ? 'one-sided' : 'two-sided'} card`,
                fieldKey: 'card_sides',
                cascadeFields: ['front_orientation', 'back_orientation', 'image_declined'],
                reaskQuestion: SIDES_GATE_QUESTION, isOrientation: false,
            });
        }
        if (preGateSnapshot.front_orientation !== ds.front_orientation && ds.front_orientation !== null) {
            state.undoHistory.push({
                kind: 'gate', category: 'orientation',
                label: 'chose the front orientation',
                fieldKey: 'front_orientation', cascadeFields: [],
                reaskQuestion: ORIENTATION_FRONT_QUESTION, isOrientation: true,
            });
        }
        if (preGateSnapshot.back_orientation !== ds.back_orientation && ds.back_orientation !== null) {
            state.undoHistory.push({
                kind: 'gate', category: 'orientation',
                label: 'chose the back orientation',
                fieldKey: 'back_orientation', cascadeFields: [],
                reaskQuestion: ORIENTATION_BACK_QUESTION, isOrientation: true,
            });
        }
        if (preGateSnapshot.image_declined !== ds.image_declined && ds.image_declined !== null) {
            state.undoHistory.push({
                kind: 'gate', category: 'image',
                label: 'answered the image question',
                fieldKey: 'image_declined', cascadeFields: [],
                reaskQuestion: IMAGE_GATE_QUESTION, isOrientation: false,
            });
        }

        // Record this turn's front-design change (if anything actually
        // changed) so a later "go back"/"undo the full bleed" has a real
        // snapshot to restore instead of nothing to work with.
        if (wasFrontDesignStage) {
            const newFrontSnapshot = snapshotFrontFields(state.design_spec);
            const category = deriveFrontChangeCategory(preFrontSnapshot, newFrontSnapshot);
            if (category) {
                state.undoHistory.push({ kind: 'tweak', category, label: categoryLabel(category), spec: preFrontSnapshot });
            }
        }

        // A full sides reset (e.g. "actually let's do one-sided instead")
        // starts the front over from scratch — any old undo history no
        // longer applies to whatever comes next.
        if (state.design_spec.card_sides === null) {
            state.undoHistory = [];
        }

        // A one-sided card has no front/image design step — the moment the
        // server confirms card_sides === 'one', treat the front as already
        // "locked" so the back-side Q&A and its progress bar behave
        // correctly, and the (nonexistent) front tab stays hidden.
        if (state.design_spec.card_sides === 'one' && !state.front_locked) {
            state.front_locked = true;
            updateEditFrontButtonVisibility();
        }

        // When the server processes a global edit request that reopens the
        // front (e.g. "actually let's do one-sided" or "I do have an image
        // after all" while working on the back), it can't change our
        // client-side front_locked flag on its own — it tells us to via
        // this field so our UI stays in sync.
        if (Object.prototype.hasOwnProperty.call(data, 'front_locked_override')) {
            state.front_locked = data.front_locked_override;
            updateEditFrontButtonVisibility();
            if (!state.front_locked) {
                switchSide('front');
            }
        }

        appendMessage('agent', data.reply_to_user || 'Updated.');

        // Show the visual rectangle picker whenever the server is waiting
        // on a landscape/portrait answer, instead of relying on the user
        // to type it correctly. Same idea for the back-template picker,
        // the capacity-check suggestions, and the QR/image upload prompt.
        if (typeof data.awaiting_gate === 'string' && data.awaiting_gate.startsWith('orientation')) {
            appendOrientationPicker();
        } else if (data.awaiting_gate === 'back_template') {
            appendBackTemplatePicker();
        } else if (data.awaiting_gate === 'back_template_capacity') {
            appendCapacitySuggestions(state.design_spec.capacity_suggestions);
        } else if (data.awaiting_gate === 'qr_image_upload') {
            appendBackImageUploadPrompt();
        }

        render();
    } catch (err) {
        appendMessage('agent', 'Connection problem. Is the server still running?');
        console.error(err);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Send';
    }
}

function send(overrideText) {
    const input = document.getElementById('userInput');
    const useOverride = typeof overrideText === 'string';
    const text = useOverride ? overrideText : input.value.trim();
    if (!text) return;
    appendMessage('user', text);
    if (!useOverride) input.value = '';
    callAgent(text);
}

document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('userInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') send();
});

document.getElementById('imageUpload').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        state.originalImageUrl = ev.target.result;
        state.image_uploaded = true;
        state.design_spec.front_layout = 'Image uploaded – ready for adjustments';
        state.design_spec.image_fit = 'contain';
        state.design_spec.background_mode = 'extend';
        state.design_spec.image_scale = 1.0;
        render();
        appendMessage('agent', "Image received! Would you like to adjust the size, reposition it, or make the background full-bleed (edge-to-edge, no white border)?");
        switchSide('front');
    };
    reader.readAsDataURL(file);
});

function downloadCard() {
    if (state.activeSide === 'front' && state.image_uploaded) {
        buildCardImage((url) => {
            const a = document.createElement('a');
            a.download = 'business-card-front.png';
            a.href = url;
            a.click();
        });
    } else if (state.activeSide === 'back') {
        buildBackCardImage((url) => {
            const a = document.createElement('a');
            a.download = 'business-card-back.png';
            a.href = url;
            a.click();
        });
    } else {
        alert('Upload an image first to download the front side.');
    }
}

render();
</script>
</body>
</html>
